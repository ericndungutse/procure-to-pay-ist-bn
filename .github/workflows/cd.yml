name: Pipeline - Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "!*.md"
  workflow_dispatch:

jobs:
  test_build:
    name: "[Prod Depl] Run tests & Build Image"
    uses: ./.github/workflows/test_build.yml
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

  deploy:
    name: "[Prod Depl] Deploy to ACA"
    runs-on: ubuntu-latest
    needs: test_build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Azure
      - name: Login into Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy to Azure Container App
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name procure-to-pay-api \
            --resource-group procure-to-pay-ist_group \
            --image ericndungutse/procure-to-pay-bn
