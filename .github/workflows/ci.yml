name: Pipeline - CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "!*.md"

jobs:
  test_build:
    uses: ./.github/workflows/test_build.yml

  qa_deploy:
    name: Deploy to QA Environment
    runs-on: ubuntu-latest
    needs: test_build
    steps:
      - name: Trigger QA Deployment on Render
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.RENDER_DEPLOY_KEY }}" ]; then
            echo "ERROR: RENDER_DEPLOY_KEY is not set. Failing."
            exit 1
          fi
          echo "RENDER_DEPLOY_KEY is present."

          RESPONSE=$(curl -s -X POST "https://api.render.com/deploy/srv-d4j0el63jp1c73cbh8jg?key=${{ secrets.RENDER_DEPLOY_KEY }}")
          echo "Render deployment response: $RESPONSE"

          if [[ "$RESPONSE" != *'"deploy":{"id":'* ]]; then
            echo "ERROR: Unexpected response from Render. Failing job."
            exit 1
          fi
          echo "Deployment triggered successfully. Deploy ID detected."
