name: CI/CD Pipeline
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

env:
  DOCKER_IMAGE: ericndungutse/procure-to-pay-bn

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building image with tag: $TAG"

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ steps.set_tag.outputs.tag }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ steps.set_tag.outputs.tag }} ${{ env.DOCKER_IMAGE }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ steps.set_tag.outputs.tag }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

  deploy_qa:
    name: Deploy to QA Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Trigger QA Deployment on Render
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.RENDER_DEPLOY_KEY }}" ]; then
            echo "ERROR: RENDER_DEPLOY_KEY is not set. Failing."
            exit 1
          fi
          echo "RENDER_DEPLOY_KEY is present."
          RESPONSE=$(curl -s -X POST "https://api.render.com/deploy/srv-d4j0el63jp1c73cbh8jg?key=${{ secrets.RENDER_DEPLOY_KEY }}")
          echo "Render deployment response: $RESPONSE"
          if [[ "$RESPONSE" != *'"deploy":{"id":'* ]]; then
            echo "ERROR: Unexpected response from Render. Failing job."
            exit 1
          fi
          echo "Deployment triggered successfully. Deploy ID detected."

  deploy_prod:
    name: Deploy to Production (Azure)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login into Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name procure-to-pay-api \
            --resource-group procure-to-pay-ist_group \
            --image ${{ env.DOCKER_IMAGE }}:${{ needs.build.outputs.image_tag }}
