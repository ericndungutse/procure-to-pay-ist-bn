name: Pipeline - Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "!*.md"

  pull_request:
    branches: [main]
    paths-ignore:
      - "!*.md"
jobs:
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: docker build -t ericndungutse/procure-to-pay-bn:latest .

      - name: Push Docker image
        run: docker push ericndungutse/procure-to-pay-bn:latest
